name: Deploy Workspace to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
env:
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
          
      - run: pnpm install --no-frozen-lockfile
      
      - name: Build Website Bundle
        env:
          PORT: 5173
          BASE_PATH: /Awaistechservices-invoincingapp/
        run: pnpm --filter @workspace/invoice-app build

      - name: Force Patch Missing Logo Path
        run: |
          find ./artifacts/invoice-app/dist -type f \( -name "*.js" -o -name "*.html" \) -exec sed -i 's|"/logo.png"|"./logo.png"|g' {} +
      
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './artifacts/invoice-app/dist'
          
      - id: deployment
        uses: actions/deploy-pages@v4
