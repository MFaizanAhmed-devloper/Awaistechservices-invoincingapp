name: Deploy Workspace to Pages
on:
  push:
    branches: ["main"]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm build # Ensure this builds to the correct output folder
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # ⚠️ Adjust to your specific build folder, e.g., apps/web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
